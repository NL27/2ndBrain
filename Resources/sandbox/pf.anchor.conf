# Loaded as pf anchor com.dao.secondbrain.
# Production agent: allowlist. Development agent: loopback only.
table <secondbrain_allow> persist file "/usr/local/etc/secondbrain/allow.ips"
table <secondbrain_dev_allow> persist file "/usr/local/etc/secondbrain/allow-dev.ips"

pass quick proto { tcp udp } from any to { 127.0.0.1, ::1 } user secondbrain-agent
pass quick proto { tcp udp } from any to <secondbrain_allow> user secondbrain-agent
block drop out proto { tcp udp } from any to any user secondbrain-agent

pass quick proto { tcp udp } from any to { 127.0.0.1, ::1 } user secondbrain-dev
pass quick proto { tcp udp } from any to <secondbrain_dev_allow> user secondbrain-dev
block drop out proto { tcp udp } from any to any user secondbrain-dev
